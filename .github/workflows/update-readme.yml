name: update readme

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-readme

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: python3 -m unittest discover -s scripts

      - name: Rebuild latest releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_readme.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "README.md unchanged"
            exit 0
          fi
          git config user.name "Ali Radid"
          git config user.email "56221012+aliradid@users.noreply.github.com"
          git commit -am "update releases"
          git push
